<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="64"
  height="64"
  viewBox="0 0 64 64"
  fill="none"
>
  <defs>
    <!-- Gradiente principal del símbolo -->
    <linearGradient id="teal" x1="4" y1="8" x2="34" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16B9B0"/>
      <stop offset="0.55" stop-color="#08A9A5"/>
      <stop offset="1" stop-color="#087F86"/>
    </linearGradient>

    <!-- Gradiente para GO -->
    <linearGradient id="go" x1="34" y1="34" x2="60" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17C0B6"/>
      <stop offset="1" stop-color="#079B9B"/>
    </linearGradient>

    <!-- Gradiente de profundidad -->
    <linearGradient id="shadow" x1="8" y1="13" x2="29" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E918F"/>
      <stop offset="1" stop-color="#075F70"/>
    </linearGradient>
  </defs>

  <!-- ========================================================= -->
  <!-- SÍMBOLO TdeA GO -->
  <!-- ========================================================= -->

  <!-- Arco exterior -->
  <path
    d="M4.8 30.5
       C3.2 20.4 9.2 11.1 18.5 7.3
       C25.4 4.5 32.2 5.8 37.2 10.2
       C30.9 6.4 23.8 6.5 17.5 10.1
       C9.7 14.5 5.4 22.2 4.8 30.5Z"
    fill="#079E9F"
  />

  <!-- Forma principal tipo recorrido -->
  <path
    d="M5.2 28.2
       C5.2 18.8 12.5 10.8 22.1 9.2
       C28.3 8.2 34.0 10.5 38.0 14.6
       L32.0 20.0
       C29.4 16.8 25.8 15.1 21.8 15.7
       C15.5 16.5 10.7 21.8 10.7 28.2
       C10.7 35.0 15.8 40.4 22.5 40.9
       C27.4 41.2 31.8 38.7 34.1 34.9
       L38.8 40.0
       C34.9 46.0 28.4 49.0 21.7 48.2
       C12.2 47.0 5.2 38.4 5.2 28.2Z"
    fill="url(#teal)"
  />

  <!-- Curva inferior del símbolo -->
  <path
    d="M5.5 38.2
       C10.1 47.1 19.0 52.2 28.4 49.8
       C33.4 48.5 37.4 45.2 40.0 40.8
       L36.5 47.0
       C32.4 53.8 23.7 57.1 15.7 54.2
       C9.8 52.1 5.3 46.9 3.8 41.4Z"
    fill="url(#shadow)"
  />

  <!-- ========================================================= -->
  <!-- BUS -->
  <!-- ========================================================= -->

  <!-- Cuerpo del bus -->
  <rect
    x="12.2"
    y="18.5"
    width="16.5"
    height="20.5"
    rx="3.2"
    fill="#F4FFFF"
  />

  <!-- Parte superior del bus -->
  <rect
    x="14.5"
    y="16.2"
    width="11.9"
    height="4.6"
    rx="2.1"
    fill="#F4FFFF"
  />

  <!-- Ventana -->
  <rect
    x="15"
    y="20.9"
    width="10.9"
    height="8.3"
    rx="1.6"
    fill="#087F86"
  />

  <!-- Frente inferior -->
  <rect
    x="15.1"
    y="31.0"
    width="10.7"
    height="6.3"
    rx="1.5"
    fill="#F4FFFF"
  />

  <!-- Faros -->
  <circle cx="17.4" cy="33.8" r="1.45" fill="#079E9F"/>
  <circle cx="23.5" cy="33.8" r="1.45" fill="#079E9F"/>

  <!-- Parachoques -->
  <rect
    x="16.2"
    y="36.5"
    width="8.6"
    height="2.2"
    rx="0.8"
    fill="#F4FFFF"
  />

  <!-- Espejos -->
  <rect x="10.7" y="22.0" width="2.1" height="5.4" rx="1" fill="#F4FFFF"/>
  <rect x="28.1" y="22.0" width="2.1" height="5.4" rx="1" fill="#F4FFFF"/>

  <!-- ========================================================= -->
  <!-- PIN DE UBICACIÓN -->
  <!-- ========================================================= -->

  <path
    d="M30.1 30.0
       C30.1 25.4 33.4 22.2 37.4 22.2
       C41.4 22.2 44.7 25.4 44.7 30.0
       C44.7 35.0 40.3 40.8 37.4 44.3
       C34.5 40.8 30.1 35.0 30.1 30.0Z"
    fill="#062E78"
  />

  <!-- Centro del pin -->
  <circle
    cx="37.4"
    cy="29.5"
    r="2.8"
    fill="#061E55"
  />

  <!-- ========================================================= -->
  <!-- TdeA -->
  <!-- ========================================================= -->

  <text
    x="32"
    y="20"
    fill="#062E78"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    font-weight="900"
    font-style="italic"
    letter-spacing="-0.8"
  >TdeA</text>

  <!-- ========================================================= -->
  <!-- GO -->
  <!-- ========================================================= -->

  <text
    x="32"
    y="43.5"
    fill="url(#go)"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    font-weight="900"
    font-style="italic"
    letter-spacing="-1.3"
  >GO</text>

  <!-- Pequeño detalle de profundidad de GO -->
  <path
    d="M34.2 46.0
       C39.0 48.0 47.2 48.8 55.8 46.7
       C52.4 50.2 46.6 52.0 40.5 51.1
       C37.6 50.7 35.5 49.1 34.2 46.0Z"
    fill="#087F86"
    opacity="0.35"
  />

</svg>
